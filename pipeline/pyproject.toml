[project]
name = "gmcebi-pipeline"
version = "0.1.0"
description = "SRD 5.2.1 -> structured JSON -> Turkish translation -> app assets"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.26", "pydantic>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pdf: needs the SRD PDF in pipeline/raw (python -m gmcebi_pipeline.fetch)"]

[tool.ruff]
line-length = 110
