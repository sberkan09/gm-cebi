# Test-group release: pushing a tag like v0.1.0-test.1 builds the internal APK
# and attaches it to a GitHub pre-release.
name: release-apk
on:
  push:
    tags: ["v*-test*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Online scene (docs/online-scene.md): on when the repository has the
      # variable NC_API_URL and the secret NC_APP_TOKEN; otherwise the APK is
      # fully offline as before. Only this test-group APK gets it: the Play and
      # TestFlight builds stay offline until the privacy declarations change.
      - name: Build internal APK
        env:
          NC_API_URL: ${{ vars.NC_API_URL }}
          NC_APP_TOKEN: ${{ secrets.NC_APP_TOKEN }}
        run: |
          defines="--dart-define=GMCEBI_INTERNAL=true --dart-define=GMCEBI_GM_PACK=true"
          if [ -n "$NC_API_URL" ] && [ -n "$NC_APP_TOKEN" ]; then
            defines="$defines --dart-define=NC_API_URL=$NC_API_URL --dart-define=NC_APP_TOKEN=$NC_APP_TOKEN"
            echo "online scene: on ($NC_API_URL)"
          else
            echo "online scene: off (NC_API_URL / NC_APP_TOKEN not set)"
          fi
          flutter build apk --release $defines
      - name: Create pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "gm-cebi-${TAG}.apk"
          gh release create "$TAG" "gm-cebi-${TAG}.apk" --prerelease \
            --title "GM Cebi ${TAG} (test)" --notes-file docs/test-guide.md
