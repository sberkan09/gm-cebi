# Test-group release: pushing a tag like v0.1.0-test.1 builds the internal APK
# and attaches it to a GitHub pre-release.
name: release-apk
on:
  push:
    tags: ["v*-test*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=GMCEBI_INTERNAL=true --dart-define=GMCEBI_GM_PACK=true
      - name: Create pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "gm-cebi-${TAG}.apk"
          gh release create "$TAG" "gm-cebi-${TAG}.apk" --prerelease \
            --title "GM Cebi ${TAG} (test)" --notes-file docs/test-guide.md
