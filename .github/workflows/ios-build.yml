# Verifies the iOS project compiles (unsigned). Signing and TestFlight upload
# are done by the product owner (docs/ios-testflight.md).
name: ios-build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=GMCEBI_INTERNAL=true --dart-define=GMCEBI_GM_PACK=true
