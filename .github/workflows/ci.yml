name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch SRD 5.2.1 (checksum-verified)
        run: python -m gmcebi_pipeline.fetch
      - run: python -m pytest -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/
      - run: flutter analyze
      - run: flutter test
      - name: Build internal APK
        run: flutter build apk --release --dart-define=GMCEBI_INTERNAL=true --dart-define=GMCEBI_GM_PACK=true
      - uses: actions/upload-artifact@v4
        with:
          name: gm-cebi-internal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
